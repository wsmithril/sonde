[workspace]
resolver = "2"
members  = ["firmware/common", "firmware/usb", "firmware/headless", "builder"]
# `firmware/common` is the shared library; the flashable binaries are its dependants.
# The root .cargo/config.toml pins the cross target (thumbv7em) for everything
# invoked from here, but `builder` is a host tool. Default a bare `cargo build`
# to the firmware binaries only; `builder` is built via the wrapper scripts,
# which pass `--target <host>` explicitly.
default-members = ["firmware/usb", "firmware/headless"]

# Shared dependency versions + the feature sets every firmware crate builds with.
# Members opt in with `dep = { workspace = true }`, so the three firmware crates
# cannot drift on a version or on the radio/defmt feature flags. `sonde-common`
# itself is a path dependency, declared per binary crate.
[workspace.dependencies]
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m", "executor-thread", "executor-interrupt", "defmt",
] }
embassy-time = { version = "0.5", features = [
    "defmt", "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.11", features = [
    "defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac",
] }
embassy-sync     = { version = "0.8" }
embassy-usb      = { version = "0.6", features = ["defmt"] }
embassy-futures  = { version = "0.1" }
static_cell      = "2.1"
heapless         = "0.9"
embedded-storage = "0.3"
defmt            = "1.1"
defmt-rtt        = "1.3"
cortex-m         = { version = "0.7", features = [
    "inline-asm", "critical-section-single-core",
] }
cortex-m-rt      = "0.7"
panic-probe      = { version = "1.0", features = ["print-defmt"] }

# Profiles must live in the workspace root, not the member crates.
[profile.release]
debug     = 0
opt-level = 3
lto       = true
